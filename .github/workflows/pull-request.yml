name: OpenAPI
on:
  pull_request:
    

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: blake-mealey/openapi-review-action@v1
        with:
          spec-paths: poweroffice-go-openapi.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}