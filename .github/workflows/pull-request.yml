name: OpenAPI
on:
  pull_request:
    

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: blake-mealey/openapi-review-action@v1
        with:
          spec-paths: poweroffice-go-openapi.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}